# Alpstein AI — portable stack (B2.2+ postgres; B2.6+ backend)
# Contract: docs/deployment/deployment-contract.md
# CLI: docker-compose v1.29 — use `docker-compose` (hyphen), project `-p alpstein-ai`
#
#   docker-compose -p alpstein-ai up -d postgres backend n8n
#   docker-compose -p alpstein-ai --profile bootstrap run --rm backend-bootstrap
#   docker-compose -p alpstein-ai -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Does NOT use legacy host container backend_postgres / bitrix_app.
# Portable n8n: service `n8n` on alpstein_internal (B2.7). Legacy host n8n: n8n/docker-compose.yml.

version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: alpstein_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alpstein_ai}
      POSTGRES_USER: ${POSTGRES_USER:-alpstein}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - alpstein_postgres_data:/var/lib/postgresql/data
    networks:
      - alpstein_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpstein -d alpstein_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    # No host ports — internal network only (production target).
    # Dev-only host bind: docker-compose.dev.yml overlay.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: alpstein-ai-backend:local
    container_name: alpstein_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WAIT_FOR_POSTGRES: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-alpstein}
      ALPSTEIN_AI_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-alpstein}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alpstein_ai}
      ALPSTEIN_AI_ENVIRONMENT: ${ALPSTEIN_AI_ENVIRONMENT:-development}
      N8N_BACKEND_API_TOKEN: ${N8N_BACKEND_API_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}}
      LANGFUSE_TRACING_ENABLED: ${LANGFUSE_TRACING_ENABLED:-false}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}
      ALPSTEIN_INSTAGRAM_N8N_INGRESS_ENABLED: ${ALPSTEIN_INSTAGRAM_N8N_INGRESS_ENABLED:-false}
      ALPSTEIN_INSTAGRAM_N8N_INGRESS_WEBHOOK_URL: ${ALPSTEIN_INSTAGRAM_N8N_INGRESS_WEBHOOK_URL:-http://n8n:5678/webhook/alpstein/unified-customer-ingress/instagram/incoming}
      ALPSTEIN_INSTAGRAM_N8N_DISPATCH_TIMEOUT_SECONDS: ${ALPSTEIN_INSTAGRAM_N8N_DISPATCH_TIMEOUT_SECONDS:-10}
      ALPSTEIN_INSTAGRAM_OUTBOUND_ENABLED: ${ALPSTEIN_INSTAGRAM_OUTBOUND_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_INITDATA_MAX_AGE_SECONDS: ${TELEGRAM_INITDATA_MAX_AGE_SECONDS:-86400}
      BCB_TELEGRAM_TENANT_ID: ${BCB_TELEGRAM_TENANT_ID:-}
      BCB_TELEGRAM_BUSINESS_ID: ${BCB_TELEGRAM_BUSINESS_ID:-}
    networks:
      - alpstein_internal
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import httpx; r=httpx.get('http://127.0.0.1:8000/api/v1/health/ready', timeout=5.0); r.raise_for_status()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    # No host ports in default file — dev overlay maps 127.0.0.1:8000 only.

  backend-bootstrap:
    profiles:
      - bootstrap
    image: alpstein-ai-backend:local
    container_name: alpstein_backend_bootstrap
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: ["/app/docker-bootstrap.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-alpstein}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-alpstein_ai}
      ALPSTEIN_AI_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-alpstein}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alpstein_ai}
      ALPSTEIN_AI_ENVIRONMENT: ${ALPSTEIN_AI_ENVIRONMENT:-development}
      RUN_SQL_BOOTSTRAP: ${RUN_SQL_BOOTSTRAP:-true}
    networks:
      - alpstein_internal
    # One-shot dev seed — NOT started by default. Requires: --profile bootstrap

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.22.5
    container_name: alpstein_n8n_compose
    restart: unless-stopped
    env_file:
      - ./n8n/.env
    environment:
      # Portable path — overrides legacy host-gateway value in n8n/.env when present.
      BACKEND_BASE_URL: http://backend:8000
      # n8n behind nginx: trust exactly one reverse proxy hop for X-Forwarded-* headers.
      N8N_PROXY_HOPS: "1"
      # n8n 2.x blocks $env in Code/expressions by default; unified ingress workflows require it.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # F.2 ERPNext Lead tail (non-blocking); set in n8n/.env — default off in repo.
      ALPSTEIN_ERPNEXT_LEAD_SYNC_ENABLED: ${ALPSTEIN_ERPNEXT_LEAD_SYNC_ENABLED:-false}
      ERPNEXT_BASE_URL: ${ERPNEXT_BASE_URL:-https://crm.alpstein-ai.ch}
      ALPSTEIN_INSTAGRAM_OUTBOUND_ENABLED: ${ALPSTEIN_INSTAGRAM_OUTBOUND_ENABLED:-false}
    volumes:
      - alpstein_n8n_data:/home/node/.n8n
    networks:
      - alpstein_internal
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "5678"
    # No host ports — dev overlay only (127.0.0.1:15680). No extra_hosts / host-gateway.
    # Do not use container_name alpstein_n8n — reserved for legacy n8n/docker-compose.yml.

networks:
  alpstein_internal:
    name: alpstein_internal

volumes:
  alpstein_postgres_data:
    name: alpstein_postgres_data
  alpstein_n8n_data:
    name: alpstein_n8n_data

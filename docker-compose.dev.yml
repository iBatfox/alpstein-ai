# Dev overlay — optional localhost access for Postgres and backend debugging.
# NOT the production target. Do not expose 0.0.0.0.
#
# Usage (from repo root, with .env containing POSTGRES_PASSWORD):
#   docker-compose -p alpstein-ai -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Postgres host port 15433 avoids collision with legacy backend_postgres on 15432.
# Backend host port 8000 is loopback-only for curl/browser from the host.

version: "3.8"

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15433}:5432"

  backend:
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"

  n8n:
    ports:
      # Personal portable runtime currently uses 15679; override N8N_HOST_PORT if legacy n8n is active.
      - "127.0.0.1:${N8N_HOST_PORT:-15679}:5678"
